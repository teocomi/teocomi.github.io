<header class="panel-cover" style="background-image: url({{ "/images/cover.jpg" | relative_url }})">
  <div class="panel-main">

    <div class="panel-main__inner panel-inverted">
    <div class="panel-main__content">
        <a href="{{ "/" | relative_url }}" title="link to home of {{ site.title }}">
          <img src="{{ "/images/profile.png" | relative_url }}" class="user-image" alt="logo">
          <h1 class="panel-cover__title panel-title">{{ site.shorttitle }}</h1>
        </a>
      </div>

    </div>

    <div class="panel-cover--overlay"></div>
  </div>
</header>
